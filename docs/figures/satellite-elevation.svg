<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<style>text{font-family:Arial,sans-serif;fill:#162b40;font-size:19px}.small{font-size:16px}.title{font-size:28px;font-weight:bold}</style>
<rect width="1000" height="560" fill="#f7fafc"/>
<title id="title">Satellite elevation above the local horizon</title><desc id="desc">A satellite at thirty degrees above a tangent horizon. A ten-degree minimum elevation mask is shown below its line of sight; local up points toward the zenith.</desc>
<text x="45" y="52" class="title">Elevation is measured from the local horizon</text>
<path d="M55 460 Q260 340 465 460 L465 520 L55 520 Z" fill="#dcebf5"/>
<text x="87" y="495">Earth (schematic)</text>
<line x1="65" y1="400" x2="915" y2="400" stroke="#587085" stroke-width="2"/>
<text x="695" y="430">Local horizon · 0°</text>
<line x1="260" y1="400" x2="260" y2="110" stroke="#587085" stroke-width="2" stroke-dasharray="7 6"/>
<text x="145" y="100">Zenith · 90°</text>
<line x1="260" y1="400" x2="770" y2="105.55" stroke="#007d83" stroke-width="4"/>
<circle cx="770" cy="105.55" r="10" fill="#007d83"/>
<text x="794" y="110">Satellite</text>
<text x="460" y="239" transform="rotate(-30 460 239)" fill="#007d83">Line of sight</text>
<line x1="260" y1="400" x2="880" y2="290.68" stroke="#b56a15" stroke-width="3" stroke-dasharray="8 6"/>
<text x="600" y="365" class="small">Example minimum elevation · 10°</text>
<path d="M375 400 A115 115 0 0 0 359.59 342.5" fill="none" stroke="#007d83" stroke-width="3"/>
<text x="395" y="350">e = 30°</text>
<circle cx="260" cy="400" r="7" fill="#162b40"/>
<text x="260" y="449">Ground location</text>
<text x="45" y="545" class="small">Illustrative geometry; angles shown are not project parameter choices.</text>
</svg>